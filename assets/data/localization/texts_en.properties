# --- Loading Screen Tips ---
loading.tip.1 = And Tiki's imaginary monsters became real
loading.tip.2 = Moko isn't the fastest, but he has a big heart
loading.tip.3 = Victory chases Zuki, but she's faster
loading.tip.4 = "Bip-bip bop-bop" - TikiBot 2026
loading.tip.5 = The spinwheel shouldn't spin, but Zuki lost one of the screws
loading.tip.6 = It's still unknown which of the three owns the sweaty sock
loading.tip.7 = The alkaline plug is TikiBot's failed attempt to make a toaster
loading.tip.8 = The ice crusher makes the best slushies \u2014 at least it does something right...
loading.tip.9 = Bananas are a great source of points and potassium
loading.tip.10 = Never take your eyes off the scarecrow...
loading.tip.11 = Have you tried carrying six ball launchers?
loading.tip.12 = The mint candy is just a regular candy
loading.tip.13 = What if all of this is just Tiki's dream?
loading.tip.14 = Never stick your hand in a slime
loading.tip.15 = Tiki only shares his inventions with two people: his sister and his best friend
loading.tip.16 = Moko loves shaking cola bottles with candies inside
loading.tip.17 = If you heat a corncob enough, it will explode on impact with the enemy
loading.tip.18 = Tiki's battles were imaginary, but the enemies stole their rules
loading.tip.19 = Tiki got expelled from school, but now he has a fire extinguisher
loading.tip.20 = Playing god mode will calm the rage inside you
