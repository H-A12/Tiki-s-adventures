# --- Loading Screen Tips ---
loading.tip.1 = Y los monstruos imaginarios de Tiki se hicieron realidad
loading.tip.2 = Moko no es el m\u00e1s veloz, pero tiene un gran coraz\u00f3n
loading.tip.3 = La victoria persigue a Zuki, pero ella es m\u00e1s r\u00e1pida
loading.tip.4 = "Bip-bip bop-bop" - TikiBot 2026
loading.tip.5 = El gatorreta no deber\u00eda girar, pero Zuki perdi\u00f3 uno de los tornillos
loading.tip.6 = A\u00fan no se sabe qui\u00e9n de los tres es el due\u00f1o del calcet\u00edn sudado
loading.tip.7 = El enchufe alcalino es un intento fallido de TikiBot de hacer una tostadora
loading.tip.8 = El triturahielo hace los mejores granizados, al menos, hace algo bien...
loading.tip.9 = Las bananas son una gran fuente de puntos y potasio
loading.tip.10 = Nunca quites tu mirada del espantap\u00e1jaros...
loading.tip.11 = \u00bfHas probado a llevar seis lanzapelotas encima?
loading.tip.12 = El caramelo de menta es un caramelo normal y corriente
loading.tip.13 = \u00bfY si todo esto es un simple sue\u00f1o de Tiki?
loading.tip.14 = Nunca metas la mano en un slime
loading.tip.15 = Tiki solo comparte sus invenciones con dos personas: su hermana y su mejor amigo
loading.tip.16 = A Moko le encanta agitar botellas de cola con caramelos dentro
loading.tip.17 = Si calientas una mazorca lo suficiente, explotar\u00e1 al impactar con el enemigo
loading.tip.18 = Las batallas de Tiki eran imaginarias, pero los enemigos robaron sus leyes
loading.tip.19 = Han expulsado a Tiki de la escuela, pero a cambio tiene un extintor
loading.tip.20 = Jugar al modo dios calmar\u00e1 la ira que llevas dentro
